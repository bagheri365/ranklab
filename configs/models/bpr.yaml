model:
  id: bpr
  family: bpr_matrix_factorization
  deterministic: false
training:
  interaction_definition: unique_user_video_pairs_collapsed_by_any_click
  positive_rule: any_click_in_training_slice
  negative_rule: exposed_pair_with_no_click_in_training_slice
  negative_sampling: same_user_uniform_with_replacement
  negatives_per_positive: 1
  resample_each_epoch: true
  objective: bpr
  seeds: [0, 1, 2, 3, 4]
  selected_dimension: 32
  selected_learning_rate: 0.05
  selected_regularization: 0.001
  fixed_primary_epochs: 1
  hyperparameter_space:
    dimensions: [16, 32, 64]
    learning_rates: [0.01, 0.05, 0.1]
    regularizations: [0.00001, 0.0001, 0.001]
  trial_budget: 27
  early_stopping: false
selection:
  tuning_seed: 0
  reference: research/audits/comparability/M0.8D_BPR_SELECTION_DECISION.md
  joint_rationale: research/audits/comparability/M0.10_BPR_LIGHTGCN_MODEL_SELECTION_RATIONALE.md
