  test_negative_sampling: none
  primary_metric: macro_ndcg
  primary_k: 10
  aggregation_unit: user
  weighting_policy: equal_user_weight
  zero_relevance_rule: exclude_from_target_macro_and_report_counts
  tie_breaking_rule: score_descending_then_video_id_ascending
  ndcg_gain: identity_binary
  ndcg_discount: one_over_log2_rank_plus_1
  relevance_scale: binary
  status: FROZEN
selection:
  practical_delta: none
  delta_selection_procedure: report_raw_effect_sizes_no_posthoc_practical_threshold
  confidence_level: 0.95
  bootstrap_replicates: 20000
  bootstrap_seed: 365
  ci_method: nonparametric_percentile
  bootstrap_unit: user_cluster
  repeated_observation_handling: paired_by_user_with_seed_mean_inside_user
  multiplicity_policy: bonferroni_simultaneous_primary_12_pairwise_comparisons
  decisive_winner_rule: top_point_estimate_and_both_simultaneous_pairwise_cis_strictly_above_zero
