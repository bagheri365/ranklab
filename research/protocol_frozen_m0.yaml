  sha256: 292d78feaff8af210fe5225c2db669fc279de616debcc3c10898e5f3833e10b2
  sha256_scope: canonical_filename_sorted_manifest_of_six_audited_csv_sha256_values
  provenance: research/audits/logging_regimes/M0.1_DATA_PROVENANCE.md
logging_regimes:
  standard_semantics: logged interactions from the standard recommender policy; is_rand=0
  randomized_semantics: logged interactions produced by random intervention in standard recommendation feeds; is_rand=1
splits:
  train_window: 2022-04-09/2022-04-16
  validation_window: 2022-04-17/2022-04-21
  test_window: 2022-04-22/2022-05-08
  eligibility_rule: apply_frozen_M0.15_shared_entity_support_then_M0.18_training_index_scoring_eligibility
training:
  source_policy: standard_only
  interaction_definition: unique_user_video_pairs_collapsed_by_any_click
  positive_definition: pair is positive if any standard-policy training exposure has
    is_click=1
  non_positive_treatment: pair is eligible negative only if exposed and never clicked
    in training slice
  negative_sampling_policy:
    scope: same_user_logged_negative_pool
    distribution: uniform
    replacement: true
    negatives_per_positive: 1
    resample_each_epoch: true
    eligibility: user has at least one positive pair and at least one eligible logged
      negative
  validation_objective: macro_ndcg_at_10_on_logged_validation_pairs_with_binary_any_click_relevance
  tuning_seed: 0
  seed_set: [0, 1, 2, 3, 4]
  cross_seed_aggregation: arithmetic_mean_over_frozen_seeds
  seed_stability_rule: report_seed_specific_scores_sd_range_and_all_seed_order_agreement
  status: FROZEN
  training_window: 2022-04-09/2022-04-16
  validation_window: 2022-04-17/2022-04-21
  checkpoint_rule:
    hyperparameters: selected once on tuning seed 0
    bpr_fixed_primary_epochs: 1
    lightgcn_fixed_primary_epochs: 28
    per_seed_validation_reselection: false
models:
  popularity:
    config: configs/models/popularity.yaml
    search_budget: not_applicable_deterministic_baseline
    selection_reference: research/audits/comparability/M0.14_POPULARITY_AND_TIEBREAK_FREEZE.md
  bpr:
    config: configs/models/bpr.yaml
    search_budget: 27_config_grid_3_dimensions_x_3_learning_rates_x_3_regularizations
    selection_reference: research/audits/comparability/M0.8D_BPR_SELECTION_DECISION.md
  lightgcn:
    config: configs/models/lightgcn.yaml
    search_budget: 27_config_grid_3_dimensions_x_3_layers_x_3_learning_rates_fixed_regularization
    selection_reference: research/audits/comparability/M0.9E_LIGHTGCN_SELECTION_DECISION.md
targets:
  target_a:
    name: is_click
    definition_card: research/targets/is_click.md
    frozen_definition: binary_raw_is_click_with_pair_relevance_any_positive_after_frozen_filters
  target_b:
    name: long_view
    definition_card: research/targets/long_view.md
    frozen_definition: binary_raw_long_view_with_pair_relevance_any_positive_after_frozen_filters
evaluation:
  ranking_unit: user
  candidate_rule: unique_logged_user_video_pairs_after_frozen_support_and_scoring_eligibility
  duplicate_rule: collapse_pair_target_relevance_any_positive
  min_candidate_set_size: 2
  less_than_k_rule: use_all_available_candidates_without_padding_or_sampling
  unseen_entity_rule: require_user_and_item_in_frozen_pairwise_training_index_for_all_models
